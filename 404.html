<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LordScizo | TikTok Matrix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: #0d0d0d;
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.3);
            --text-gray: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px var(--neon-glow), 0 0 20px var(--neon-glow);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header h1 span {
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* TIKTOK GRID (4 NEBENEINANDER) */
        .tiktok-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-container {
            background-color: var(--card-bg);
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 10px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 580px; /* Ungefähre Höhe eines TikTok-Embeds */
        }

        .video-container:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--neon-green);
            box-shadow: 0 0 25px var(--neon-glow);
        }

        /* REFRESH BUTTON */
        .refresh-btn {
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--neon-glow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            background-color: var(--neon-green);
            color: var(--bg-black);
            box-shadow: 0 0 25px var(--neon-green);
            transform: scale(1.05);
        }

        /* FOOTER */
        footer {
            margin-top: 60px;
            color: var(--text-gray);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* RESPONSIVE (FALLBACK FÜR SMARTPHONES & TABLETS) */
        @media (max-width: 1200px) {
            .tiktok-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 680px) {
            .tiktok-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>SYSTEM_<span>ROTATION</span></h1>
        <p class="subtitle">> Loading 4 random feeds from data core...</p>
    </header>

    <main class="tiktok-grid" id="matrixGrid">
        </main>

    <button class="refresh-btn" onclick="rerollVideos()">
        <i class="fa-solid fa-arrows-rotate"></i> ROLL NEW FEED
    </button>

    <footer>
        &copy; 2026 LordScizo • TWO WORDS • ONE FINGER
    </footer>

    <script>
        // --- DEIN TIKTOK-POOL ---
        // Ersetze diese IDs einfach mit den IDs deiner gewünschten TikTok-Videos!
        // Du findest die ID in der URL des Videos (z.B. tiktok.com/@user/video/7123456789012345678)
        const tiktokVideoPool = [
            "7345330342602738977", // Beispiel ID 1
            "7312345678901234567", // Beispiel ID 2
            "7323456789012345678", // Beispiel ID 3
            "7334567890123456789", // Beispiel ID 4
            "7345678901234567890", // Beispiel ID 5
            "7356789012345678901", // Beispiel ID 6
            "7367890123456789022", // Beispiel ID 7
            "7378901234567890333"  // Beispiel ID 8 (Füge beliebig viele hinzu!)
        ];

        function loadRandomTikToks() {
            const grid = document.getElementById('matrixGrid');
            grid.innerHTML = ''; // Altes Grid leeren

            // 1. Pool kopieren, um das Original nicht zu verändern
            let poolCopy = [...tiktokVideoPool];
            
            // Fallback, falls du mal weniger als 4 IDs eingetragen hast
            if (poolCopy.length < 4) {
                console.warn("Bitte füge mindestens 4 IDs in den tiktokVideoPool ein!");
                return;
            }

            // 2. Fischer-Yates Shuffle zum perfekten Durchmischen des Arrays
            for (let i = poolCopy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [poolCopy[i], poolCopy[j]] = [poolCopy[j], poolCopy[i]];
            }

            // 3. Die ersten 4 einzigartigen Videos aus dem gemischten Pool nehmen
            const selectedVideos = poolCopy.slice(0, 4);

            // 4. HTML-Struktur für die TikTok-Embeds bauen und einfügen
            selectedVideos.forEach(videoId => {
                const container = document.createElement('div');
                container.className = 'video-container';
                
                // Das offizielle TikTok Blockquote-Format
                container.innerHTML = `
                    <blockquote class="tiktok-embed" data-video-id="${videoId}" style="max-width: 605px; min-width: 325px;">
                        <section>
                            <a target="_blank" href="https://www.tiktok.com/video/${videoId}">Loading Cyber-Feed...</a>
                        </section>
                    </blockquote>
                `;
                grid.appendChild(container);
            });

            # 5. Das TikTok-Embed-Skript frisch laden, damit die injizierten Blockquotes in echte Player verwandelt werden
            const oldScript = document.getElementById('tiktok-wjs');
            if (oldScript) oldScript.remove(); // Altes Skript löschen, falls vorhanden

            const script = document.createElement('script');
            script.id = 'tiktok-wjs';
            script.src = "https://www.tiktok.com/embed.js";
            script.async = true;
            document.body.appendChild(script);
        }

        // Funktion für den manuellen "Roll"-Button
        function rerollVideos() {
            const btnIcon = document.querySelector('.refresh-btn i');
            btnIcon.classList.add('fa-spin'); // Drehanimation starten
            
            loadRandomTikToks();
            
            setTimeout(() => {
                btnIcon.classList.remove('fa-spin');
            }, 1000);
        }

        // Beim ersten Laden der Seite sofort ausführen
        window.onload = loadRandomTikToks;
    </script>
</body>
</html>
